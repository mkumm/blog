[[redirects]]
  from = "/posts/*"
  to = "/writing/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/writings/*"
  to = "/writing/:splat"
  status = 301
  force = true

# Blog renamed to Writing
[[redirects]]
  from = "/blog/*"
  to = "/writing/:splat"
  status = 301
  force = true

# Old RSS feed location
[[redirects]]
  from = "/index.xml"
  to = "/rss.xml"
  status = 301
  force = true

# www + old RSS feed
[[redirects]]
  from = "https://www.mkumm.com/index.xml"
  to = "https://mkumm.com/rss.xml"
  status = 301
  force = true

# www → apex catch-all
[[redirects]]
  from = "https://www.mkumm.com/*"
  to = "https://mkumm.com/:splat"
  status = 301
  force = true

# Deleted post — no known destination
